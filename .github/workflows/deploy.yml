name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Rede de segurança para endereços que não existem. Precisa vir ANTES da
      # pré-renderização, para o 404.html ficar com a casca neutra em vez de
      # uma cópia da home.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      # Grava um HTML real por rota. Sem isto o Pages responde 404 em tudo que
      # não seja a raiz, e buscador não indexa página que responde 404.
      # O script falha o build se alguma rota sair vazia — melhor não publicar
      # do que publicar casca. Usa o Chrome que já vem na imagem do runner;
      # a versão fica no log para o caso de a imagem mudar.
      - name: Prerender routes
        run: |
          google-chrome --version
          pnpm prerender

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
