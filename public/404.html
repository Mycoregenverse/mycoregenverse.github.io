<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Mycoregenverse</title>
    <script>
      // Fallback de SPA para GitHub Pages.
      // O Pages não faz rewrite de rotas, então recarregar /manifesto devolve
      // este 404.html. Aqui a rota é codificada na query string e devolvida ao
      // index.html, que a restaura antes do app montar. pathSegmentsToKeep = 1
      // preserva o subcaminho do repositório (/mycoregenverse/).
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
